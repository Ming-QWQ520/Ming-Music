name: Android Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (must be clean)
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ming-music-apk
          path: |
            build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
