name: Android Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (must be clean)
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # 回归闸门：2026-10 黑屏事故——AGP 9 默认开启 R8 minify，会裁掉
      # shared_preferences 2.5.x JNI 直连路径的 suspend 方法
      # （签名含 Continuation，运行时经 JNI GetMethodID 查找，R8 不可见）。
      # 此处校验 dex 中该签名仍然存在，缺失即判定构建被裁剪，直接失败。
      - name: Verify plugin JNI methods survive in dex
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if unzip -p "$APK" classes.dex | strings -a | \
             grep -F "Ljava/util/List;" | grep -qF "Lkotlin/coroutines/Continuation;)Ljava/lang/Object;"; then
            echo "OK: suspend JNI signatures present in dex"
          else
            echo "::error::R8 stripped JNI-invoked suspend methods (shared_preferencesRegistrar.getAll...). Ensure release build has isMinifyEnabled=false."
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ming-music-apk
          path: |
            build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
