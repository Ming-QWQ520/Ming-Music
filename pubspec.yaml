name: ming_music
description: "MingMusic - 一个高颜值、高可玩性的液态玻璃风格音乐播放器 (Flutter + MD3)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 国际化资源 (zh/en)
  intl: any

  # --- 状态管理 ---
  flutter_riverpod: ^2.6.1

  # --- 音频引擎 ---
  just_audio: ^0.10.3        # 播放内核
  audio_service: ^0.18.18    # 后台播放 / 通知栏 / 锁屏控制

  # --- 本地存储 ---
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5      # 通知栏封面缓存 / 背景图片持久化

  # --- 设备能力 ---
  image_picker: ^1.1.2       # 自定义背景选图
  device_info_plus: ^11.3.0  # 低端机自动降级液态玻璃 (Android SDK 版本判定)
  permission_handler: ^11.4.0 # Android 13+ 通知权限

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/covers/
    - assets/lyrics/
